lnsd:
  ns-instance-id: "11223344"
  ns:
    name: "Demo1 scenario"
    id: "aaaabbbb"
    vendor: "D6G"
    descriptor-version: "1.0"
    location-id: 40
    default-service-id: "30"
    default-nfrouter-mode: "bmv2"
    default-interpod-mode: 'br'
    infra-nfs: []
    network-functions: []
    application-functions:
      - instance-id: "app"
        id: "iperf3"
        name: "Pkt destination"
        version: "1.0"
        node: "p42"
        domain: "external"
        static-nfids: [44,45]
        static-macs: ["02:22:33:44:55:99"]
        static-ips: ["10.30.7.213"]
        is-scalable: true
        instances: 2
        static-instance-ips: ["10.30.7.213", "10.30.7.214"]
        static-instance-nodes: ["orin3", "ubuntu"]
    site-connections:
      - id: "site1"
        application-functions:
          - instance-id: "ran"
            static-nfids: [42,43]
            static-ips: ["10.10.10.44"]
            is-ue: true
        network-functions: []
      - id: "site2"
        application-functions:
          - instance-id: "app"
            static-nfids: [44,45]
        network-functions: []
    forwarding_graphs:
      - graph-name: "upstream"
        direction: "upstream"
        links:
          - id: "upstream-1"
            connection-points:
            - if-id-ref: "ran:0"
            - if-id-ref: "app:0"
      - graph-name: "downstream"
        direction: "downstream"
        links:
          - id: "downstream-1"
            connection-points:
            - if-id-ref: "app:0"
            - if-id-ref: "ran:0"
    e2e_delay_budget: "25ms"
